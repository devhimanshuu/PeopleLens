service: peoplelens-api
org: himanshuu

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  memorySize: 512
  timeout: 29
  environment:
    NODE_ENV: production
    DATABASE_URL: ${env:DATABASE_URL}
    NEON_AUTH_BASE_URL: ${env:NEON_AUTH_BASE_URL}
    SESSION_CACHE_TTL_MS: ${env:SESSION_CACHE_TTL_MS, "60000"}
    ADMIN_EMAILS: ${env:ADMIN_EMAILS}
    GROQ_API_KEY: ${env:GROQ_API_KEY}
    OPENROUTER_API_KEY: ${env:OPENROUTER_API_KEY}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'

package:
  individually: true
  patterns:
    - '!src/**'
    - '!test/**'
    - 'dist/**'
    - 'prisma/**'
    - 'node_modules/**'
